<svg width="760" height="130" viewBox="0 0 760 130" xmlns="http://www.w3.org/2000/svg">
  <style>
    .name, .role, .rule { opacity: 0; }
    .name {
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }
    .rule {
      animation: draw 0.9s cubic-bezier(0.16, 1, 0.3, 1) 1.0s forwards;
    }
    .role {
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 1.6s forwards;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes draw {
      from { opacity: 1; stroke-dashoffset: 220; }
      to   { opacity: 1; stroke-dashoffset: 0; }
    }
    text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
  </style>

  <text class="name" x="2" y="46" font-size="30" font-weight="600" fill="#1F2328">Shezin Khais</text>

  <line class="rule" x1="2" y1="64" x2="222" y2="64" stroke="#0969DA" stroke-width="2"
        stroke-dasharray="220" stroke-dashoffset="220" stroke-linecap="round" />

  <text class="role" x="2" y="94" font-size="15" fill="#57606A">Computer Science Student · Python Tooling &amp; Research Utilities</text>
</svg>
